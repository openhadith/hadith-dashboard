<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Amiri:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body { background: #e7e3da; font-family: 'IBM Plex Sans Arabic', 'IBM Plex Sans', sans-serif; -webkit-font-smoothing: antialiased; color: #2b2925; }
  a { color: #2f6f5b; text-decoration: none; }
  a:hover { color: #235445; text-decoration: underline; }
  input, button { font-family: inherit; }
  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-thumb { background: #cfc9bc; border-radius: 6px; border: 3px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-track { background: transparent; }
  @keyframes omPal { from { opacity: 0; transform: translateY(-8px) scale(.985); } to { opacity: 1; transform: none; } }
  @keyframes omBk { from { opacity: 0; } to { opacity: 1; } }
  @keyframes omToast { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
</style>
</helmet>
<div ref="{{ rootRef }}" dir="rtl" style="position: relative; height: 100vh; overflow: hidden; background: #e7e3da;">

  <!-- ===== BLURRED FAUX-WORKSTATION BACKDROP ===== -->
  <div style="position: absolute; inset: 0; filter: blur(7px) saturate(.9) brightness(.98); transform: scale(1.04); opacity: .8; pointer-events: none;">
    <div style="height: 54px; background: #f6f4ee; border-bottom: 1px solid #d8d2c5; display: flex; align-items: center; gap: 14px; padding: 0 18px;">
      <div style="width: 26px; height: 26px; border-radius: 6px; background: #2f6f5b;"></div>
      <div style="width: 150px; height: 12px; border-radius: 6px; background: #d9d3c6;"></div>
      <div style="flex: 1;"></div>
      <div style="width: 320px; height: 30px; border-radius: 8px; background: #ece7dc;"></div>
      <div style="flex: 1;"></div>
      <div style="width: 90px; height: 22px; border-radius: 6px; background: #dfe9e2;"></div>
    </div>
    <div style="display: flex; height: calc(100vh - 54px);">
      <div style="width: 250px; background: #efece3; border-inline-start: 1px solid #ddd7ca; padding: 18px 14px; display: flex; flex-direction: column; gap: 12px;">
        <div style="height: 11px; width: 60%; background: #d9d3c6; border-radius: 5px;"></div>
        <div style="height: 34px; background: #e4dfd4; border-radius: 8px;"></div>
        <div style="height: 34px; background: #e4dfd4; border-radius: 8px;"></div>
        <div style="height: 34px; background: #e4dfd4; border-radius: 8px;"></div>
        <div style="height: 34px; background: #e4dfd4; border-radius: 8px;"></div>
      </div>
      <div style="flex: 1; padding: 26px 30px; display: flex; flex-direction: column; gap: 16px;">
        <div style="height: 15px; width: 40%; background: #d9d3c6; border-radius: 6px;"></div>
        <div style="height: 120px; background: #f2efe7; border: 1px solid #e2ddd0; border-radius: 12px;"></div>
        <div style="height: 13px; width: 80%; background: #ddd7ca; border-radius: 6px;"></div>
        <div style="height: 13px; width: 72%; background: #ddd7ca; border-radius: 6px;"></div>
        <div style="height: 90px; background: #f2efe7; border: 1px solid #e2ddd0; border-radius: 12px;"></div>
      </div>
      <div style="width: 300px; background: #efece3; border-inline-end: 1px solid #ddd7ca; padding: 20px 16px; display: flex; flex-direction: column; gap: 12px;">
        <div style="height: 11px; width: 50%; background: #d9d3c6; border-radius: 5px;"></div>
        <div style="height: 60px; background: #e4dfd4; border-radius: 10px;"></div>
        <div style="height: 60px; background: #e4dfd4; border-radius: 10px;"></div>
      </div>
    </div>
  </div>

  <!-- ===== SCRIM ===== -->
  <div onClick="{{ dismiss }}" style="position: absolute; inset: 0; background: rgba(28,24,18,.42); animation: omBk .18s ease;"></div>

  <!-- ===== PALETTE ===== -->
  <div style="position: absolute; top: 12vh; left: 50%; transform: translateX(-50%); width: min(640px, 92vw); z-index: 10; animation: omPal .17s cubic-bezier(.2,.9,.3,1);">
    <div style="background: #fffdf8; border: 1px solid #ddd7ca; border-radius: 16px; box-shadow: 0 32px 80px rgba(28,22,14,.34), 0 4px 14px rgba(28,22,14,.12); overflow: hidden;">

      <!-- search row -->
      <div style="display: flex; align-items: center; gap: 12px; padding: 15px 18px; border-bottom: 1px solid #eee7d9;">
        <span style="font-size: 18px; color: #b0a892;">⌕</span>
        <input ref="{{ inputRef }}" value="{{ query }}" onInput="{{ onInput }}" onKeyDown="{{ onKey }}" placeholder="بگەڕێ لە پەڕەکان، کردارەکان و ڕێکخستنەکان…" style="flex: 1; border: none; outline: none; background: transparent; font-family: inherit; font-size: 15.5px; color: #2b2925;" />
        <span style="font-size: 10.5px; font-family: 'IBM Plex Sans'; padding: 3px 8px; border: 1px solid #e0dacd; border-radius: 5px; background: #f4f1e9; color: #948d7d;">Esc</span>
      </div>

      <!-- results -->
      <div ref="{{ listRef }}" style="max-height: 52vh; overflow-y: auto; padding: 8px;">
        <sc-for list="{{ rows }}" as="r" hint-placeholder-count="9">
          <sc-if value="{{ r.isHeader }}" hint-placeholder-val="{{ false }}">
            <div style="padding: 12px 12px 6px; font-size: 10.5px; font-weight: 600; letter-spacing: .5px; color: #a89f8c; text-transform: uppercase;">{{ r.group }}</div>
          </sc-if>
          <sc-if value="{{ r.isItem }}" hint-placeholder-val="{{ true }}">
            <div data-item="1" onClick="{{ r.onClick }}" onMouseEnter="{{ r.onHover }}" style="display: flex; align-items: center; gap: 13px; padding: 10px 12px; border-radius: 10px; cursor: pointer; background: {{ r.bg }}; transition: background .08s;">
              <span style="width: 30px; height: 30px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: {{ r.iconBg }}; color: {{ r.iconFg }}; font-size: 15px;">{{ r.icon }}</span>
              <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px;">
                <span style="font-size: 13.5px; color: #2b2925; font-weight: 500;">{{ r.label }}</span>
                <span style="font-size: 11px; color: #a89f8c;">{{ r.sub }}</span>
              </div>
              <sc-if value="{{ r.kbd }}" hint-placeholder-val=""><kbd style="font-family: 'IBM Plex Sans'; font-size: 10.5px; padding: 3px 7px; background: #f4f1e9; border: 1px solid #e0dacd; border-radius: 5px; color: #6b6659;">{{ r.kbd }}</kbd></sc-if>
              <sc-if value="{{ r.showEnter }}" hint-placeholder-val="{{ false }}"><span style="font-size: 13px; color: #2f6f5b;">⏎</span></sc-if>
            </div>
          </sc-if>
        </sc-for>
        <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
          <div style="padding: 34px 20px; text-align: center;">
            <div style="font-size: 22px; opacity: .35; margin-bottom: 8px;">⌕</div>
            <div style="font-size: 13px; color: #a89f8c;">هیچ ئەنجامێک نەدۆزرایەوە بۆ «{{ query }}»</div>
          </div>
        </sc-if>
      </div>

      <!-- footer -->
      <div style="display: flex; align-items: center; gap: 16px; padding: 9px 16px; border-top: 1px solid #eee7d9; background: #faf8f2; font-size: 11px; color: #948d7d;">
        <span style="display: flex; align-items: center; gap: 6px;"><kbd style="font-family:'IBM Plex Sans'; font-size:10px; padding:2px 6px; background:#f0ede4; border:1px solid #e0dacd; border-radius:4px;">↑</kbd><kbd style="font-family:'IBM Plex Sans'; font-size:10px; padding:2px 6px; background:#f0ede4; border:1px solid #e0dacd; border-radius:4px;">↓</kbd> گەشتکردن</span>
        <span style="display: flex; align-items: center; gap: 6px;"><kbd style="font-family:'IBM Plex Sans'; font-size:10px; padding:2px 6px; background:#f0ede4; border:1px solid #e0dacd; border-radius:4px;">⏎</kbd> کردنەوە</span>
        <span style="display: flex; align-items: center; gap: 6px;"><kbd style="font-family:'IBM Plex Sans'; font-size:10px; padding:2px 6px; background:#f0ede4; border:1px solid #e0dacd; border-radius:4px;">Tab</kbd> جۆرەکان</span>
        <span style="flex: 1;"></span>
        <span style="display: flex; align-items: center; gap: 6px; font-family: 'Amiri', serif; font-size: 13px; color: #b0a892;">حەدیس · پاڵێت</span>
      </div>
    </div>

    <!-- filter chips -->
    <div style="display: flex; gap: 8px; margin-top: 14px; justify-content: center; flex-wrap: wrap;">
      <sc-for list="{{ chips }}" as="c" hint-placeholder-count="5">
        <button onClick="{{ c.onClick }}" style="font-family: inherit; font-size: 12px; padding: 6px 14px; border-radius: 999px; cursor: pointer; border: 1px solid {{ c.bd }}; background: {{ c.bg }}; color: {{ c.fg }}; display: flex; align-items: center; gap: 6px;">{{ c.label }}</button>
      </sc-for>
    </div>
  </div>

  <dc-import name="Hadith Search Modal" open="{{ modalOpen }}" context="گەڕانی پێشکەوتووی حەدیس لە پاڵێتی فەرمان" onPick="{{ onPick }}" onClose="{{ closeModal }}" hint-size="0,0"></dc-import>

  <sc-if value="{{ toast }}" hint-placeholder-val="">
    <div style="position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%); z-index: 40; display: flex; align-items: center; gap: 10px; padding: 11px 18px; background: #2b2925; color: #fbf9f3; border-radius: 10px; font-size: 13px; box-shadow: 0 10px 30px rgba(0,0,0,.3); animation: omToast .2s ease;">
      <span style="width: 8px; height: 8px; border-radius: 50%; background: {{ toastDot }};"></span>{{ toast }}
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { query: '', sel: 0, cat: 'all', toast: '', toastDot: '#2f6f5b', modalOpen: false };

  componentDidMount() {
    this._key = (e) => {
      if (e.key === 'ArrowDown') { e.preventDefault(); this.move(1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); this.move(-1); }
      else if (e.key === 'Enter') { e.preventDefault(); this.run(); }
      else if (e.key === 'Escape') { if (this.state.modalOpen) return; e.preventDefault(); this.dismiss(); }
      else if (e.key === 'Tab') { e.preventDefault(); this.cycleCat(e.shiftKey ? -1 : 1); }
    };
    window.addEventListener('keydown', this._key);
  }
  componentWillUnmount() { window.removeEventListener('keydown', this._key); }

  go(u) { window.location.href = encodeURI(u); }
  dismiss() { this.go('Hadith Workstation.dc.html'); }

  showToast(msg, dot) {
    this.setState({ toast: msg, toastDot: dot || '#2f6f5b' });
    clearTimeout(this._t); this._t = setTimeout(() => this.setState({ toast: '' }), 2200);
  }

  allItems() {
    const go = (u) => () => this.go(u);
    return [
      // navigation
      { cat: 'nav', icon: '▦', label: 'داشبۆرد', sub: 'پوختەی کار و ئاماری گشتی', act: go('Dashboard.dc.html') },
      { cat: 'nav', icon: '✔', label: 'ڕیزی پەسەندکردن', sub: '۳۱۲ ڕەکۆرد چاوەڕوانن', act: go('Validation Queue.dc.html') },
      { cat: 'search', icon: '⌕', label: 'گەڕانی پێشکەوتووی حەدیس', sub: 'کردنەوەی پەنجەرەی گەڕان — شێوازی شامیلە', kbd: '⇧⌕', act: () => this.setState({ modalOpen: true, sel: 0 }) },
      { cat: 'nav', icon: '❝', label: 'ئیندێکسی حەدیس', sub: 'گەڕان و پاڵاوتنی حەدیسەکان', act: go('Hadith Index.dc.html') },
      { cat: 'nav', icon: '☰', label: 'ئیندێکسی ڕاویان', sub: 'داتابەیسی ڕاوییەکان', act: go('Narrator Index.dc.html') },
      { cat: 'nav', icon: '▣', label: 'ئیندێکسی پەرتووکەکان', sub: 'سەرچاوە و پەرتووکەکان', act: go('Book Index.dc.html') },
      { cat: 'nav', icon: '✍', label: 'ئیندێکسی نووسەران', sub: 'نووسەر و کۆمپایلەرەکان', act: go('Author Index.dc.html') },
      { cat: 'nav', icon: '⑃', label: 'پشکنینی سەنەد', sub: 'دیاگرامی زنجیرەی ڕیوایەت', act: go('Sanad Explorer.dc.html') },
      { cat: 'nav', icon: '◨', label: 'بەراورد و جیاوازی', sub: 'بەراوردکردنی دوو ڕیوایەت', act: go('Compare Diff.dc.html') },
      { cat: 'nav', icon: '⌂', label: 'وۆرک‌ستەیشن', sub: 'دەستکاری و پەسەندکردنی ڕەکۆرد', act: go('Hadith Workstation.dc.html') },
      // actions
      { cat: 'act', icon: '✓', iconBg: '#e4efe9', iconFg: '#2f6f5b', label: 'پەسەندکردنی ڕەکۆردی ئێستا', sub: 'کردنەوەی وۆرک‌ستەیشن و پەسەندکردن', kbd: 'V', act: () => this.go('Hadith Workstation.dc.html') },
      { cat: 'act', icon: '✕', iconBg: '#f4e2dc', iconFg: '#a8412a', label: 'ڕەتکردنەوەی ڕەکۆرد', sub: 'نیشانکردن وەک ناتەواو', kbd: 'R', act: () => this.go('Hadith Workstation.dc.html') },
      { cat: 'act', icon: '💬', iconBg: '#e2eaf4', iconFg: '#3f6392', label: 'نیشانکردن بۆ گفتوگۆ', sub: 'ناردن بۆ پێداچوونەوەی هاوبەش', kbd: 'D', act: () => this.go('Hadith Workstation.dc.html') },
      { cat: 'act', icon: '⏎', iconBg: '#e4efe9', iconFg: '#2f6f5b', label: 'پاشەکەوت و ڕەکۆردی دواتر', sub: 'خزانە بۆ ڕەکۆردی داهاتوو', kbd: '⌘↵', act: () => this.go('Hadith Workstation.dc.html') },
      { cat: 'act', icon: '＋', iconBg: '#efe6d4', iconFg: '#9a7b2e', label: 'حەدیسی نوێ زیادبکە', sub: 'دروستکردنی ڕەکۆردێکی نوێ', act: () => this.showToast('فۆرمی حەدیسی نوێ دەکرێتەوە', '#9a7b2e') },
      { cat: 'act', icon: '＋', iconBg: '#efe6d4', iconFg: '#9a7b2e', label: 'ڕاوی نوێ زیادبکە', sub: 'زیادکردن بۆ داتابەیسی ڕاویان', act: () => this.showToast('فۆرمی ڕاوی نوێ دەکرێتەوە', '#9a7b2e') },
      // settings / appearance
      { cat: 'set', icon: '◐', label: 'دۆخی تاریک', sub: 'گۆڕین بۆ ڕووکاری تاریک', act: () => this.showToast('دۆخی تاریک — بەم زووانە', '#3f6392') },
      { cat: 'set', icon: '▤', label: 'گۆڕینی چڕی نمایش', sub: 'Comfortable ↔ Compact', act: () => this.showToast('چڕی نمایش گۆڕدرا', '#2f6f5b') },
      { cat: 'set', icon: 'ت', label: 'پیشاندان/شاردنەوەی تەشکیل', sub: 'کۆنتڕۆڵی هێمای دەنگدار', act: () => this.showToast('تەشکیل گۆڕدرا', '#2f6f5b') },
      { cat: 'set', icon: 'ع', label: 'گۆڕینی زمانی ڕووکار', sub: 'کوردی · عربی · English', act: () => this.showToast('هەڵبژاردەی زمان', '#2f6f5b') },
      { cat: 'set', icon: '⚙', label: 'ڕێکخستنەکان و بەڕێوەبردن', sub: 'هەژمار، تیم و مۆڵەتەکان', act: () => this.showToast('پەڕەی ڕێکخستن — بەم زووانە', '#3f6392') },
    ];
  }

  filtered() {
    const q = this.state.query.trim();
    const cat = this.state.cat;
    return this.allItems().filter(it =>
      (cat === 'all' || it.cat === cat) &&
      (!q || it.label.indexOf(q) !== -1 || (it.sub && it.sub.indexOf(q) !== -1))
    );
  }

  move(d) {
    const n = this.filtered().length; if (!n) return;
    this.setState(s => ({ sel: (s.sel + d + n) % n }), () => this.scrollSel());
  }
  scrollSel() {
    if (!this.listEl) return;
    const el = this.listEl.querySelectorAll('[data-item]')[this.state.sel];
    if (el) { const r = el.getBoundingClientRect(), c = this.listEl.getBoundingClientRect();
      if (r.bottom > c.bottom) this.listEl.scrollTop += r.bottom - c.bottom + 8;
      else if (r.top < c.top) this.listEl.scrollTop -= c.top - r.top + 8; }
  }
  run() { const f = this.filtered(); const it = f[this.state.sel]; if (it) it.act(); }
  cycleCat(d) {
    const cats = ['all', 'search', 'nav', 'act', 'set'];
    const i = cats.indexOf(this.state.cat);
    this.setState({ cat: cats[(i + d + cats.length) % cats.length], sel: 0 });
  }

  renderVals() {
    const { query, sel, cat, toast, toastDot } = this.state;
    const items = this.filtered();
    const GN = { search: 'گەڕان', nav: 'گەشتکردن', act: 'کردارەکان', set: 'ڕێکخستن و ڕووکار' };

    // build rows (headers + items) preserving group order, tracking selectable index
    const order = ['search', 'nav', 'act', 'set'];
    const rows = []; let idx = 0;
    order.forEach(g => {
      const gi = items.filter(it => it.cat === g);
      if (!gi.length) return;
      rows.push({ isHeader: true, isItem: false, group: GN[g] });
      gi.forEach(it => {
        const i = idx++;
        const selected = i === sel;
        rows.push({
          isHeader: false, isItem: true,
          icon: it.icon, label: it.label, sub: it.sub, kbd: it.kbd || '',
          iconBg: it.iconBg || (selected ? '#e9e3d5' : '#f0ece2'),
          iconFg: it.iconFg || '#8a8272',
          bg: selected ? '#f1ede2' : 'transparent',
          showEnter: selected,
          onClick: () => it.act(),
          onHover: () => this.setState({ sel: i }),
        });
      });
    });

    const chip = (id, label) => {
      const on = cat === id;
      return { label, onClick: () => this.setState({ cat: id, sel: 0 }),
        bg: on ? '#2f6f5b' : '#fffdf8', fg: on ? '#fff' : '#6b6659', bd: on ? '#2f6f5b' : '#ddd7ca' };
    };

    return {
      rootRef: (el) => { this.rootEl = el; },
      listRef: (el) => { this.listEl = el; },
      inputRef: (el) => { if (el) setTimeout(() => { try { el.focus(); } catch (e) {} }, 30); },
      query, rows, empty: items.length === 0, toast, toastDot,
      onInput: (e) => this.setState({ query: e.target.value, sel: 0 }),
      onKey: (e) => {
        if (e.key === 'ArrowDown') { e.preventDefault(); this.move(1); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); this.move(-1); }
        else if (e.key === 'Enter') { e.preventDefault(); this.run(); }
      },
      dismiss: () => this.dismiss(),
      modalOpen: this.state.modalOpen,
      closeModal: () => this.setState({ modalOpen: false }),
      onPick: (rec) => this.setState({ modalOpen: false }, () => this.go('Hadith Workstation.dc.html')),
      chips: [chip('all', 'هەموو'), chip('search', 'گەڕان'), chip('nav', 'گەشتکردن'), chip('act', 'کردارەکان'), chip('set', 'ڕێکخستن')],
    };
  }
}
</script>
</body>
</html>
